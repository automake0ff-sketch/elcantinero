<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="tostBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261E16"/><stop offset="100%" stop-color="#110C07"/>
    </radialGradient>
    <linearGradient id="breadCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tostBg)"/>
  <!-- Tabla de madera rústica -->
  <rect x="150" y="240" width="500" height="240" rx="20" fill="#451A03" stroke="#291003" stroke-width="4"/>
  <!-- Rebanada de pan de semillas tostado -->
  <path d="M 220,380 C 200,320 230,280 340,270 C 470,260 580,280 570,360 C 560,420 480,440 330,440 C 240,440 230,410 220,380 Z" fill="url(#breadCrust)"/>
  <!-- Capa generosa de salmorejo -->
  <path d="M 240,370 C 230,320 250,290 340,285 C 450,280 540,290 545,350 C 540,400 470,420 340,420 C 260,420 245,400 240,370 Z" fill="#DC2626"/>
  <!-- Virutas de jamón ibérico y semillas de sésamo -->
  <path d="M 300,330 Q 360,310 420,340" stroke="#7F1D1D" stroke-width="12" stroke-linecap="round"/>
  <path d="M 380,360 Q 440,340 500,370" stroke="#991B1B" stroke-width="10" stroke-linecap="round"/>
  <circle cx="280" cy="350" r="2.5" fill="#FEF08A"/><circle cx="480" cy="320" r="2.5" fill="#FEF08A"/><circle cx="360" cy="390" r="2.5" fill="#FEF08A"/>
  <!-- Gotas doradas de AOVE -->
  <circle cx="330" cy="310" r="5" fill="#FACC15" opacity="0.8"/>
  <circle cx="450" cy="380" r="6" fill="#FACC15" opacity="0.8"/>
  <text x="400" y="530" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#F5F5F4" text-anchor="middle">Tostada de Semillas con Salmorejo y Jamón</text>
</svg>
