<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="albBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B13"/><stop offset="100%" stop-color="#120B07"/>
    </radialGradient>
    <radialGradient id="cazuela" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#B45309"/><stop offset="80%" stop-color="#78350F"/><stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
    <radialGradient id="meatBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9A3412"/><stop offset="60%" stop-color="#7C2D12"/><stop offset="100%" stop-color="#431407"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#albBg)"/>
  <!-- Cazuela de barro andaluza -->
  <ellipse cx="400" cy="380" rx="300" ry="150" fill="url(#cazuela)" stroke="#451A03" stroke-width="6"/>
  <ellipse cx="400" cy="370" rx="260" ry="120" fill="#EA580C" opacity="0.85"/>
  <!-- Albóndigas en salsa humeante -->
  <circle cx="340" cy="350" r="55" fill="url(#meatBall)"/>
  <circle cx="460" cy="340" r="58" fill="url(#meatBall)"/>
  <circle cx="400" cy="400" r="56" fill="url(#meatBall)"/>
  <!-- Salsa brillante y perejil picado -->
  <ellipse cx="400" cy="370" rx="240" ry="90" fill="#CA8A04" opacity="0.35"/>
  <circle cx="350" cy="340" r="3" fill="#15803D"/><circle cx="450" cy="330" r="3.5" fill="#15803D"/><circle cx="410" cy="390" r="4" fill="#15803D"/>
  <text x="400" y="540" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#F5F5F4" text-anchor="middle">Albóndigas Caseras en Salsa de la Abuela</text>
</svg>
