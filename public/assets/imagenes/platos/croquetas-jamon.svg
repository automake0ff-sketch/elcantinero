<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="croqPlateBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A241E"/>
      <stop offset="60%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#E5A93C"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="creamFill" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FEF3C7"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <filter id="shadowCroq" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#croqPlateBg)"/>

  <!-- Plato de pizarra artesanal sevillano -->
  <ellipse cx="400" cy="380" rx="340" ry="180" fill="#201D1A" stroke="#332D27" stroke-width="3" filter="url(#shadowCroq)"/>
  <ellipse cx="400" cy="376" rx="310" ry="160" fill="#1A1715" stroke="#2B2621" stroke-width="1.5"/>

  <!-- Brote verde / Perejil decorativo -->
  <path d="M 400,290 C 390,260 410,240 430,250 C 440,260 420,280 400,290 Z" fill="#4D7C0F"/>
  <path d="M 400,290 C 380,270 370,250 380,240 C 395,245 400,270 400,290 Z" fill="#65A30D"/>

  <!-- Croqueta 1 (Fondo izquierda) -->
  <g transform="translate(230, 290) rotate(-18)">
    <ellipse cx="60" cy="40" rx="80" ry="46" fill="url(#crustGrad)" filter="url(#shadowCroq)"/>
    <circle cx="30" cy="30" r="4" fill="#FFF275" opacity="0.8"/>
    <circle cx="80" cy="45" r="5" fill="#78350F" opacity="0.7"/>
    <circle cx="100" cy="30" r="3" fill="#FFF275" opacity="0.9"/>
  </g>

  <!-- Croqueta 2 (Fondo derecha) -->
  <g transform="translate(450, 300) rotate(15)">
    <ellipse cx="60" cy="40" rx="82" ry="48" fill="url(#crustGrad)" filter="url(#shadowCroq)"/>
    <circle cx="40" cy="35" r="4" fill="#FFF275" opacity="0.9"/>
    <circle cx="70" cy="48" r="5" fill="#78350F" opacity="0.8"/>
  </g>

  <!-- Croqueta Principal Abierta (Centro, revelando interior cremoso de jamón) -->
  <g transform="translate(300, 310)">
    <!-- Mitad izquierda crujiente -->
    <path d="M 10,60 C 10,25 45,15 80,25 C 85,45 80,75 75,95 C 40,105 10,95 10,60 Z" fill="url(#crustGrad)" filter="url(#shadowCroq)"/>
    <!-- Mitad derecha crujiente -->
    <path d="M 120,25 C 155,15 190,25 190,60 C 190,95 160,105 125,95 C 120,75 115,45 120,25 Z" fill="url(#crustGrad)" filter="url(#shadowCroq)"/>
    <!-- Interior de bechamel sedosa fundida -->
    <path d="M 75,30 C 95,20 105,20 125,30 C 130,55 125,85 125,95 C 105,108 95,108 75,95 C 75,85 70,55 75,30 Z" fill="url(#creamFill)"/>
    <!-- Trocitos de jamón ibérico brillante -->
    <path d="M 90,45 L 105,42 L 100,54 L 88,52 Z" fill="#991B1B"/>
    <path d="M 102,65 L 115,62 L 112,72 L 98,70 Z" fill="#7F1D1D"/>
    <path d="M 85,75 L 94,72 L 92,82 L 82,80 Z" fill="#991B1B"/>
    <!-- Brillos cremosos -->
    <ellipse cx="100" cy="40" rx="12" ry="6" fill="#FFF" opacity="0.7"/>
    <ellipse cx="105" cy="78" rx="8" ry="4" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- Partículas de panko y sal marina espolvoreada -->
  <circle cx="340" cy="460" r="3" fill="#E5A93C"/>
  <circle cx="360" cy="475" r="2" fill="#FFFBEB"/>
  <circle cx="450" cy="465" r="3.5" fill="#E5A93C"/>
  <circle cx="480" cy="450" r="2" fill="#FFFBEB"/>
  <circle cx="280" cy="430" r="2.5" fill="#D97706"/>
  <circle cx="520" cy="430" r="3" fill="#D97706"/>

  <!-- Insignia flotante 'Firma de la Casa' -->
  <rect x="50" y="45" width="220" height="42" rx="21" fill="#1F1C18" stroke="#E5A93C" stroke-width="1.5"/>
  <text x="160" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1">
    ★ ESPECIALIDAD ESTRELLA
  </text>
</svg>
