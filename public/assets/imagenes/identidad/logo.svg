<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B47818" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E5A93C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Isotipo: Croqueta dorada estilizada con panko y destellos -->
  <g transform="translate(15, 12)">
    <!-- Aura de calor -->
    <ellipse cx="48" cy="48" rx="42" ry="30" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)"/>
    <!-- Cuerpo de la croqueta -->
    <path d="M 22,48 C 22,26 36,22 48,22 C 60,22 74,26 74,48 C 74,70 60,74 48,74 C 36,74 22,70 22,48 Z" 
          fill="url(#goldGrad)" stroke="#8C530A" stroke-width="2.5" />
    <!-- Textura crujiente panko -->
    <circle cx="36" cy="38" r="2.5" fill="#FFF275" opacity="0.9"/>
    <circle cx="58" cy="40" r="2" fill="#FFF275" opacity="0.9"/>
    <circle cx="48" cy="50" r="3" fill="#FFE082" opacity="0.95"/>
    <circle cx="38" cy="58" r="2.2" fill="#78350F" opacity="0.7"/>
    <circle cx="56" cy="58" r="2.5" fill="#78350F" opacity="0.7"/>
    <circle cx="48" cy="32" r="1.8" fill="#FFF275" opacity="0.9"/>
    <!-- Vapor sutil -->
    <path d="M 40,16 Q 44,10 40,4" stroke="#E5A93C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 54,18 Q 58,11 54,6" stroke="#E5A93C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Tipografía de marca -->
  <text x="115" y="58" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" letter-spacing="4" fill="#FDFCF7">
    EL CANTINERO
  </text>
  <text x="117" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="8" fill="#E5A93C">
    TAPAS &middot; SEVILLA ESTE
  </text>
  <line x1="117" y1="96" x2="380" y2="96" stroke="#E5A93C" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
</svg>
